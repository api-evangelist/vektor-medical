aid: vektor-medical
name: Vektor Medical
description: >-
  Vektor Medical is a San Diego based medical technology company whose vMap system is an
  FDA-cleared and CE-marked, AI-based arrhythmia mapping solution. vMap analyzes standard
  12-lead ECG data and produces beat-by-beat 2D and 3D cardiac source maps across all four
  chambers of the heart in about a minute, without requiring an invasive catheter-based
  mapping procedure. Electrophysiologists use it for triage, procedural planning and
  ablation guidance across focal and fibrillation-type arrhythmias and atrial and
  ventricular pacing. The product is delivered as Software as a Medical Device to
  hospitals and health systems under clinical agreements. Vektor Medical publishes no
  public developer program, API reference, or machine-readable API contract.
